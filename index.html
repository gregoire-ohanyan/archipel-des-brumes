// ---------------------------------------------------------------- actions du joueur
function canTrade(isl) {
  if (!present(isl)) return 'Il faut un comptoir sur cette île.';
  if ((P().banUntil[isl] || -1) > gday()) return 'Vous êtes exclu de cette bourse pour quelques jours.';
  return null;
}
const ok = (msg, extra) => Object.assign({ ok: true, msg }, extra || {});
const ko = msg => ({ ok: false, msg });
const A = {
  buyMarket(isl, g, qty) {
    const e = canTrade(isl); if (e) return ko(e);
    if (S.isl[isl].banned[g]) return ko('Ce bien est interdit ici.');
    const asks = S.books[isl][g].asks; let need = qty, lim = 0;
    for (const o of asks) { lim = o.price; need -= o.qty; if (need <= 0) break; }
    if (!lim) return ko('Personne ne vend ce bien en ce moment.');
    const r = place('player', isl, g, 'buy', lim, qty, { ioc: true });
    if (!r.filled) return ko(r.err === 'fonds' ? 'Fonds insuffisants.' : 'Rien acheté.');
    const msg = `Acheté ${r.filled} ${G[g].name} pour ${fmt(r.cost)} § (moyenne ${r2(r.cost / r.filled)} §).`;
    log('bourse', msg); return ok(msg);
  },
  sellMarket(isl, g, qty) {
    const e = canTrade(isl); if (e) return ko(e);
    const r = place('player', isl, g, 'sell', 0.01, qty, { ioc: true });
    if (!r.filled) return ko(r.err === 'stock' ? 'Stock insuffisant.' : 'Aucun acheteur.');
    const msg = `Vendu ${r.filled} ${G[g].name} pour ${fmt(r.cost)} § (moyenne ${r2(r.cost / r.filled)} §).`;
    log('bourse', msg); return ok(msg);
  },
  limit(isl, g, side, price, qty) {
    const e = canTrade(isl); if (e) return ko(e);
    if (!(price > 0) || !(qty > 0)) return ko('Prix et quantité requis.');
    const r = place('player', isl, g, side, price, qty, { ttl: 24 * 30 });
    if (r.err === 'fonds') return ko('Fonds insuffisants.');
    if (r.err === 'stock') return ko('Stock insuffisant.');
    if (r.err) return ko('Ordre refusé.');
    let msg = `Ordre ${side === 'buy' ? "d'achat" : 'de vente'} placé : ${qty} ${G[g].name} à ${r2(price)} §.`;
    if (r.filled) msg += ` ${r.filled} exécutés immédiatement.`;
    log('bourse', msg); return ok(msg);
  },
  cancel(isl, g, id) {
    const b = S.books[isl][g];
    for (const side of ['bids', 'asks']) {
      const k = b[side].findIndex(o => o.id === id && o.a === 'player');
      if (k >= 0) { refund(b[side][k], isl, g); b[side].splice(k, 1); return ok('Ordre annulé.'); }
    }
    return ko('Ordre introuvable.');
  },
  openComptoir(isl) {
    const pl = P();
    if (present(isl)) return ko('Vous avez déjà un comptoir ici.');
    if (!pl.unlocked[2] && pl.comptoirs.length >= 2) return ko('Un colporteur ne peut tenir que 2 comptoirs. Devenez Négociant (5 000 § de valeur nette).');
    if (PA().cash < COSTS.comptoir) return ko(`Il faut ${COSTS.comptoir} §.`);
    PA().cash -= COSTS.comptoir; pl.comptoirs.push(isl);
    log('info', `Comptoir ouvert à ${I[isl].name}. Vous y voyez désormais la bourse en direct.`);
    return ok('Comptoir ouvert.');
  },
  closeComptoir(isl) {
    const pl = P();
    if (isl === 'port') return ko('Votre comptoir de Port-Sablier est votre siège.');
    cancelOrders('player', isl);
    pl.comptoirs = pl.comptoirs.filter(c => c !== isl);
    return ok(`Comptoir de ${I[isl].name} fermé. Votre stock y reste entreposé.`);
  },
  ship(from, to, cargo, mode, shipId, escort, smuggle) {
    const pl = P(), a = PA();
    if (from === to) return ko('Choisissez une autre destination.');
    if (embargoed(from, to)) return ko('Embargo : aucune liaison directe entre ces îles.');
    const items = Object.keys(cargo).filter(g => cargo[g] > 0);
    let total = 0;
    for (const g of items) { if (stockOf(a, from, g) < cargo[g]) return ko(`Stock insuffisant de ${G[g].name}.`); total += cargo[g]; }
    const days = PATH[from][to].days;
    let ship = null, cost = 0;
    if (mode === 'fret') {
      if (!items.length) return ko('Rien à expédier.');
      cost = Math.ceil(total * freightCost(days));
      if (smuggle) return ko('La contrebande demande votre propre navire.');
    } else {
      if (!pl.unlocked[2]) return ko('Il faut être Négociant pour avoir un navire.');
      ship = pl.ships.find(s => s.id === shipId);
      if (!ship || ship.at !== from || ship.status !== 'idle') return ko('Aucun de vos navires disponible dans ce port.');
      if (total > ship.cap) return ko(`Capacité du navire : ${ship.cap}.`);
    }
    if (a.cash < cost) return ko('Fonds insuffisants pour le fret.');
    a.cash -= cost;
    items.forEach(g => addStock(a, from, g, -cargo[g]));
    const c = {}; items.forEach(g => { c[g] = cargo[g]; });
    const sh = launch('player', from, to, c, { fret: mode === 'fret', shipId: ship && ship.id, escort: !!escort && !!ship, smuggle: !!smuggle && !!ship });
    if (ship) ship.status = 'sailing';
    const eta = Math.round((sh.arr - S.hour) / 24 * 10) / 10;
    const msg = `Expédition vers ${I[to].name} : arrivée prévue dans ${eta} jours${cost ? ` (fret : ${fmt(cost)} §)` : ''}.`;
    log('mer', msg); return ok(msg);
  },
  buyShip(isl) {
    const pl = P();
    if (!pl.unlocked[2]) return ko('Il faut être Négociant.');
    if (!present(isl)) return ko('Il faut un comptoir sur cette île.');
    const price = isl === 'bois' ? COSTS.ship : COSTS.shipFar;
    if (PA().cash < price) return ko(`Il faut ${fmt(price)} §.`);
    PA().cash -= price;
    const names = ['La Mouette', "L'Audacieuse", 'Le Sceau d\'Or', 'La Brumeuse', 'Le Héron', 'La Fortune', 'Le Vif-Argent', "L'Intrépide"];
    const name = names[pl.ships.length % names.length] + (pl.ships.length >= names.length ? ' II' : '');
    pl.ships.push({ id: S.seq++, name, at: isl, status: 'idle', cap: 150 });
    log('mer', `Vous achetez le navire « ${name} » (${fmt(price)} §).`);
    return ok(`Navire « ${name} » acheté.`);
  },
  sellShip(id) {
    const pl = P(); const s = pl.ships.find(x => x.id === id);
    if (!s || s.status !== 'idle') return ko('Navire indisponible.');
    pl.ships = pl.ships.filter(x => x.id !== id); PA().cash += 1500;
    return ok(`« ${s.name} » vendu 1 500 §.`);
  },
  hireInformant(isl) {
    const pl = P();
    if (!pl.unlocked[2]) return ko('Il faut être Négociant.');
    if (pl.informants.includes(isl)) return ko('Déjà un informateur ici.');
    if (PA().cash < COSTS.informant) return ko(`Il faut ${COSTS.informant} §.`);
    PA().cash -= COSTS.informant; pl.informants.push(isl);
    return ok(`Un informateur vous renseigne désormais sur ${I[isl].name} avec un jour de retard.`);
  },
  fireInformant(isl) { P().informants = P().informants.filter(x => x !== isl); return ok('Informateur congédié.'); },
  buyColombier() {
    const pl = P();
    if (!pl.unlocked[2]) return ko('Il faut être Négociant.');
    if (pl.colombier) return ko('Vous avez déjà un colombier.');
    if (PA().cash < COSTS.colombier) return ko(`Il faut ${fmt(COSTS.colombier)} §.`);
    PA().cash -= COSTS.colombier; pl.colombier = true;
    return ok('Vos oiseaux-messagers divisent par deux le retard des nouvelles.');
  },
  buildWorkshop(isl, recipe) {
    const pl = P();
    if (!pl.unlocked[3]) return ko('Il faut être Manufacturier.');
    if (!present(isl)) return ko('Il faut un comptoir sur cette île.');
    const r = RECIPES[recipe];
    if (PA().cash < r.cost) return ko(`Il faut ${fmt(r.cost)} §.`);
    PA().cash -= r.cost;
    pl.workshops.push({ id: S.seq++, isl, recipe, level: 1, on: true, status: 'en attente', last: 0 });
    log('atelier', `${r.name} construit à ${I[isl].name}.`);
    return ok(`${r.name} construit.`);
  },
  upgradeWorkshop(id) {
    const w = P().workshops.find(x => x.id === id); if (!w) return ko('Atelier introuvable.');
    if (w.level >= 3) return ko('Niveau maximal atteint.');
    const cost = Math.round(RECIPES[w.recipe].cost * (w.level === 1 ? 1.2 : 1.8));
    if (PA().cash < cost) return ko(`Il faut ${fmt(cost)} §.`);
    PA().cash -= cost; w.level++;
    return ok(`Atelier amélioré au niveau ${w.level}.`);
  },
  toggleWorkshop(id) { const w = P().workshops.find(x => x.id === id); if (!w) return ko('?'); w.on = !w.on; return ok(w.on ? 'Atelier relancé.' : 'Atelier arrêté.'); },
  buySeat() {
    const pl = P();
    if (!pl.unlocked[3]) return ko('Il faut être Manufacturier.');
    if (pl.seat) return ko('Vous avez déjà un siège.');
    if (PA().cash < COSTS.seat) return ko(`Il faut ${fmt(COSTS.seat)} §.`);
    PA().cash -= COSTS.seat; pl.seat = true; updateStage();
    return ok('Vous siégez à la Grande Bourse.');
  },
  buyOption(sid, K, type, n) {
    const pl = P();
    if (!pl.unlocked[4]) return ko('Il faut un siège à la Grande Bourse.');
    const s = S.optSeries.find(x => x.id === sid); if (!s) return ko('Série introuvable.');
    const pr = optPrice(s.g, K, type, s.exp), cost = pr.ask * OPTION_SIZE * n;
    if (!(n > 0)) return ko('Quantité invalide.');
    if (PA().cash < cost) return ko('Fonds insuffisants.');
    PA().cash -= cost;
    pl.options.push({ id: S.seq++, sid, g: s.g, K, type, n, paid: cost, exp: s.exp });
    const msg = `Acheté ${n} option(s) ${type === 'call' ? "d'achat" : 'de vente'} ${G[s.g].name} à ${K} § pour ${fmt(cost)} §.`;
    log('options', msg); return ok(msg);
  },
  sellOption(id) {
    const pl = P(); const pos = pl.options.find(x => x.id === id); if (!pos) return ko('Position introuvable.');
    const v = optPrice(pos.g, pos.K, pos.type, pos.exp).bid * OPTION_SIZE * pos.n;
    PA().cash += v; pl.options = pl.options.filter(x => x.id !== id);
    const msg = `Options revendues ${fmt(v)} § (payées ${fmt(pos.paid)} §).`;
    log('options', msg); return ok(msg);
  },
  acceptContract(id) {
    const c = S.contracts.find(x => x.id === id);
    if (!c || c.status !== 'offre') return ko('Offre indisponible.');
    if (S.contracts.filter(x => x.status === 'actif').length >= 4) return ko('Vous avez déjà 4 contrats en cours.');
    c.status = 'actif'; return ok('Contrat accepté.');
  },
  declineContract(id) { S.contracts = S.contracts.filter(x => x.id !== id); return ok('Offre déclinée.'); },
  deliverContract(id) {
    const c = S.contracts.find(x => x.id === id), pl = P();
    if (!c || c.status !== 'actif') return ko('Contrat indisponible.');
    if (stockOf(PA(), c.isl, c.g) < c.qty) return ko(`Il vous faut ${c.qty} ${G[c.g].name} dans votre entrepôt de ${I[c.isl].name}.`);
    addStock(PA(), c.isl, c.g, -c.qty);
    addStock(S.accounts['npc:' + c.npc], c.isl, c.g, c.qty);
    const pay = c.qty * c.price; PA().cash += pay; fx(c.isl, pay);
    const n = S.npcs[c.npc];
    n.rel = clamp(n.rel + 12, -100, 100); n.favors++;
    pl.fiabilite = clamp(pl.fiabilite + 3, 0, 100); pl.prestigeBase += 1; pl.contractsDone++;
    c.status = 'livré';
    remember(n, `Le joueur a livré ${c.qty} ${G[c.g].name} comme promis.`);
    const msg = `Contrat honoré : ${fmt(pay)} § et une faveur de ${n.name}.`;
    log('contrat', msg); return ok(msg);
  },
  favor(npcId, action, arg) {
    const n = S.npcs[npcId], pl = P();
    const cost = { secret: 1, etouffer: 2, vote: 1 }[action];
    if (n.favors < cost) return ko(`${n.name} ne vous doit pas assez de faveurs.`);
    if (action === 'secret') {
      const known = S.rumors.filter(r => r.heard <= gday() && (r.origin === n.home || r.island === n.home) && !pl.revealed[r.id]);
      known.forEach(r => { pl.revealed[r.id] = true; });
      pl.insider[n.home] = true;
      const up = S.events.filter(e => e.isl === n.home || e.a === n.home);
      n.favors -= cost;
      let msg = `${n.name} vous confie ses secrets. `;
      msg += known.length ? `Rumeurs vérifiées : ${known.map(r => `« ${r.text} » est ${r.truth ? 'VRAIE' : 'FAUSSE'}`).join(' ; ')}. ` : 'Aucune rumeur à vérifier sur son île. ';
      if (up.length) msg += `Elle/il sait que quelque chose se prépare : ${up.map(e => e.type === 'prod' ? `production de ${G[e.g].name.toLowerCase()} ${e.mult < 1 ? 'en forte baisse' : 'en hausse'} d'ici ${e.day - gday()} jours` : e.type === 'fad' ? `une mode des ${G[e.g].name.toLowerCase()} dans ${e.day - gday()} jours` : e.type === 'strike' ? `une grève dans ${e.day - gday()} jours` : `un embargo dans ${e.day - gday()} jours`).join(', ')}. `;
      const p = S.council[n.home];
      if (p && !p.resolved) msg += `Au Conseil, « ${p.text} » recueille ${Math.round((p.base + p.sway) * 100)} % des voix.`;
      log('faveur', msg, { alert: "Information d'initié", pause: true });
      return ok(msg);
    }
    if (action === 'etouffer') {
      S.isl[n.home].suspicion = Math.max(0, S.isl[n.home].suspicion - 35);
      n.favors -= cost;
      const msg = `${n.name} fait taire les curieux à ${I[n.home].name}.`;
      log('faveur', msg); return ok(msg);
    }
    if (action === 'vote') {
      if (!pl.unlocked[5]) return ko('Il faut être Notable.');
      const p = S.council[n.home]; if (!p || p.resolved) return ko('Aucun vote en cours.');
      p.sway += arg > 0 ? 0.1 : -0.1; pl.sway[n.home] = (pl.sway[n.home] || 0) + 1;
      n.favors -= cost;
      return ok(`${n.name} pèsera ${arg > 0 ? 'pour' : 'contre'} la proposition.`);
    }
    return ko('?');
  },
  spreadRumor(isl, g, dir) {
    const pl = P();
    if (!pl.unlocked[2]) return ko('Il faut être Négociant.');
    if (!present(isl) && !pl.informants.includes(isl)) return ko('Il faut un comptoir ou un informateur sur cette île.');
    if (PA().cash < COSTS.rumor) return ko(`Il faut ${COSTS.rumor} §.`);
    PA().cash -= COSTS.rumor;
    const cred = clamp(30 + prestige() / 2 + (pl.probite - 50) / 4, 15, 85);
    const gname = G[g].name.toLowerCase();
    const r = createRumor({ origin: isl, island: isl, g, dir, truth: false, cred: Math.round(cred), src: 'player', text: (dir > 0 ? pick(RUMOR_UP) : pick(RUMOR_DOWN))(gname, I[isl].name) });
    pl.revealed[r.id] = true;
    S.isl[isl].suspicion = clamp(S.isl[isl].suspicion + 10, 0, 100);
    pl.probite = clamp(pl.probite - 2, 0, 100);
    const msg = `Vos hommes répandent la rumeur à ${I[isl].name} (crédibilité ${Math.round(cred)}).`;
    log('rumeur', msg); return ok(msg);
  },
  sway(isl, kind, dir, amount) {
    const pl = P();
    if (!pl.unlocked[5]) return ko('Il faut être Notable.');
    const p = S.council[isl]; if (!p || p.resolved) return ko('Aucun vote en cours.');
    const sgn = dir > 0 ? 1 : -1;
    if (kind === 'don') {
      amount = Math.floor(amount);
      if (!(amount >= 50)) return ko('Don minimum : 50 §.');
      if (PA().cash < amount) return ko('Fonds insuffisants.');
      PA().cash -= amount; p.sway += sgn * Math.min(0.15, amount / 2500); pl.prestigeBase += amount / 1000;
      pl.sway[isl] = (pl.sway[isl] || 0) + 1;
      return ok(`Don de ${fmt(amount)} § aux factions ${sgn > 0 ? 'favorables' : 'opposées'}.`);
    }
    if (kind === 'corruption') {
      if (PA().cash < COSTS.corruption) return ko(`Il faut ${COSTS.corruption} §.`);
      PA().cash -= COSTS.corruption; p.sway += sgn * 0.15;
      S.isl[isl].suspicion = clamp(S.isl[isl].suspicion + 18, 0, 100); pl.probite = clamp(pl.probite - 6, 0, 100);
      pl.sway[isl] = (pl.sway[isl] || 0) + 1;
      return ok('Quelques conseillers ont été « convaincus ».');
    }
    return ko('?');
  },
  launchFad(isl, g) {
    const pl = P();
    if (!pl.unlocked[5]) return ko('Il faut être Notable.');
    if (PA().cash < COSTS.fad) return ko(`Il faut ${fmt(COSTS.fad)} §.`);
    if (S.isl[isl].banned[g]) return ko('Ce bien est interdit sur cette île.');
    PA().cash -= COSTS.fad;
    const lag = 4;
    const r = createRumor({ origin: isl, island: isl, g, dir: 1, truth: true, cred: 55, src: 'player', resolveIn: lag, text: `Un patricien en vue ne jure plus que par les ${G[g].name.toLowerCase()} à ${I[isl].name}.` });
    pl.revealed[r.id] = true;
    schedule({ type: 'fad', isl, g, mult: 3, day: gday() + lag, dur: 30, text: `Sous votre influence, la mode est aux ${G[g].name.toLowerCase()} à ${I[isl].name}.` });
    return ok(`Vous financez un patricien de ${I[isl].name} : la mode prendra dans ${lag} jours.`);
  },
  blackSell(isl, g, qty) {
    const st = S.isl[isl];
    if (!st.banned[g]) return ko("Ce bien n'est pas interdit ici : vendez-le en bourse.");
    const have = stockOf(PA(), isl, g); qty = Math.min(qty, have);
    const sold = S.blackSold[isl] || 0;
    qty = Math.min(qty, 20 - sold);
    if (qty <= 0) return ko(sold >= 20 ? "Le marché noir est saturé aujourd'hui." : 'Rien à vendre.');
    const legal = ISLANDS.filter(i => !S.isl[i.id].banned[g]).map(i => S.books[i.id][g].ema);
    const ref = legal.reduce((x, y) => x + y, 0) / Math.max(1, legal.length);
    const price = ref * 2.2 * (1 - 0.02 * sold);
    addStock(PA(), isl, g, -qty);
    addStock(S.accounts['pop:' + isl + ':bourgeois'], isl, g, qty);
    PA().cash += price * qty; S.blackSold[isl] = sold + qty; fx(isl, price * qty);
    st.suspicion = clamp(st.suspicion + 2 + qty * 0.5, 0, 100);
    P().probite = clamp(P().probite - 1, 0, 100);
    const msg = `Marché noir de ${I[isl].name} : ${qty} ${G[g].name} vendus ${fmt(price * qty)} §.`;
    log('loi', msg); return ok(msg);
  },
};

// ---------------------------------------------------------------- vues pour l'interface
function knownSnap(isl) {
  const d = infoDelay(isl);
  if (d === 0) return { delay: 0, live: true };
  const st = S.isl[isl], target = gday() - d;
  let snap = null;
  for (let k = st.snaps.length - 1; k >= 0; k--) { if (st.snaps[k].d <= target) { snap = st.snaps[k]; break; } }
  return { delay: d, live: false, snap, hist: st.snaps.filter(s => s.d <= target) };
}
function knownRumors() { return S.rumors.filter(r => r.heard <= gday()).slice().reverse(); }
function playerOrders() {
  const out = [];
  ISLANDS.forEach(i => GOODS.forEach(g => {
    const b = S.books[i.id][g.id];
    b.bids.forEach(o => { if (o.a === 'player') out.push({ isl: i.id, g: g.id, side: 'buy', price: o.price, qty: o.qty, id: o.id }); });
    b.asks.forEach(o => { if (o.a === 'player') out.push({ isl: i.id, g: g.id, side: 'sell', price: o.price, qty: o.qty, id: o.id }); });
  }));
  return out;
}

const API = { _bestTrade: (n, A, x, o) => bestTrade(n, A, x, o), _fill: (n,t)=>fillCargo(n,t),
  newGame, tick, A, get S() { return S; }, set S(v) { S = v; },
  load(state) { S = state; }, save() { return JSON.stringify(S); },
  day, gday, seasonIdx, year, seasonStart, PATH, ROUTE_INFO, rkey, stockOf, bestAsk, bestBid, infoDelay, present, knownSnap,
  knownRumors, playerOrders, netWorth, prestige, optPrice, striking, embargoed, fadMult, prodMult, freightCost, COSTS, D,
};
if (typeof module !== 'undefined' && module.exports) module.exports = API; else root.ARCHIPEL = API;
})(typeof window !== 'undefined' ? window : globalThis);

<script>// L'Archipel des Brumes — textes d'aide, glossaire et guide des premiers pas
(function () {
'use strict';
const GLOSS = {
  sceaux: ['Sceaux (§)', "La monnaie unique de l'archipel. Elle garde sa valeur dans le temps : la Banque de l'Archipel veille à ce que le niveau général des prix ne dérive pas. Vos Sceaux sont disponibles sur toutes les îles à la fois, contrairement à vos marchandises, qui restent là où elles sont entreposées."],
  valeur: ['Valeur nette', "Tout ce que vous possédez : vos Sceaux, plus ce que rapporteraient vos marchandises si vous les vendiez, vos navires, vos ateliers et vos options. Un gros stock est compté moins cher que le prix affiché, car le vendre d'un coup ferait baisser le cours. C'est votre valeur nette qui débloque les stades Négociant (5 000 §) et Manufacturier (12 000 §)."],
  prestige: ['Prestige', "Votre renommée dans l'archipel. Il grandit avec votre fortune, vos contrats honorés et vos dons aux Conseils ; il chute si vous êtes ruiné. Un fort prestige rend vos rumeurs plus crédibles. À 50, vous devenez Notable."],
  stade: ['Stades', "Vous commencez Colporteur. Négociant (5 000 § de valeur nette) : comptoirs illimités, navires, informateurs, contrats et rumeurs. Manufacturier (12 000 §) : ateliers. Spéculateur (siège à la Grande Bourse) : options. Notable (prestige 50) : influence sur les Conseils et lancement de modes. Tous les rôles se cumulent."],
  prix: ['Prix (cours moyen)', "La moyenne des échanges des derniers jours sur l'île. C'est un repère pour comparer les îles et suivre les tendances, mais personne ne vous vendra ni ne vous achètera exactement à ce prix. Pour commercer, regardez « Vous achetez à » et « Vous vendez à »."],
  achetez: ['Vous achetez à', "Le prix du vendeur le moins cher de l'île, en ce moment. C'est ce que vous paierez au minimum en touchant « Acheter », plus la taxe de bourse. Si vous achetez plus que ce que ce vendeur propose, les unités suivantes viennent de vendeurs plus chers."],
  vendez: ['Vous vendez à', "Le meilleur prix qu'un acheteur de l'île propose, en ce moment. C'est ce que vous toucherez au maximum en touchant « Vendre », moins la taxe de bourse. Si vous vendez plus que ce que cet acheteur prend, les unités suivantes partent à des prix plus bas."],
  ecart: ["L'écart entre achat et vente", "Sur une même île, on achète toujours plus cher qu'on ne revend, comme dans un bureau de change. Revendre aussitôt ce qu'on vient d'acheter fait donc perdre de l'argent. On gagne en transportant les marchandises vers une île où elles valent plus, en attendant que les prix montent, ou en les transformant dans un atelier."],
  cinqj: ['Variation sur 5 jours', "De combien le prix a monté (vert) ou baissé (rouge) depuis 5 jours. Une forte hausse attire les spéculateurs suiveurs de tendance, qui peuvent pousser le prix encore plus haut… puis le faire s'effondrer."],
  stock: ['Votre stock', "La quantité de ce bien dans votre entrepôt sur cette île. Les marchandises ne se déplacent pas seules : pour les vendre ailleurs, il faut les expédier par mer (onglet Navigation)."],
  humeur: ['Humeur du marché', "Le moral des marchands pour ce bien, de la peur (à gauche, en rouge) à l'euphorie (à droite, en vert). Elle bouge avec les hausses de prix et les rumeurs. En euphorie, les vendeurs retiennent leur stock et les acheteurs paient plus : c'est le moment de vendre, pas d'acheter. En panique, c'est l'inverse."],
  comptoir: ['Comptoir', "Votre bureau sur une île : il vous montre la bourse en direct, vous permet d'y acheter et vendre, et vous donne un entrepôt. Coût : 500 § puis 4 § par jour. Un Colporteur ne peut en tenir que 2 ; un Négociant autant qu'il veut."],
  nouvelles: ['Nouvelles en retard', "Sans comptoir sur une île, ses prix et ses événements vous arrivent avec les navires, donc avec plusieurs jours de retard. Les prix affichés sont ceux d'il y a n jours : ils ont peut-être changé. Pour réduire ce retard : ouvrez un comptoir (0 jour), engagez un informateur (1 jour) ou bâtissez un colombier (retard divisé par deux)."],
  taxe: ['Taxe de bourse', "Un pourcentage prélevé à chaque achat et à chaque vente sur l'île. Elle est fixée par le Conseil de l'île, qui peut la relever ou la baisser au fil des saisons."],
  salaire: ['Salaire', "Ce que coûte un ouvrier par jour sur l'île. Il monte quand beaucoup d'ateliers y embauchent. Il pèse sur le coût de vos ateliers et sur celui des marchands concurrents."],
  satisfaction: ['Satisfaction des habitants', "Chaque île compte quatre couches sociales. Chacune achète chaque jour ce dont elle a besoin : des rations et du poisson salé pour tous, des outils, des lanternes et de l'essence de brume pour les plus aisés. La barre indique quelle part de leurs besoins est couverte. Bien servie, la population grandit ; mal servie, elle s'en va. Si les manouvriers tombent sous 45 % plusieurs jours, la grève éclate."],
  greve: ['Grève', "Mines et ateliers de l'île sont à l'arrêt pendant une à deux semaines. La production chute et les prix montent, sur l'île et chez ceux qui en dépendent. Une rumeur de grève précède souvent la grève elle-même : c'est le moment de stocker."],
  mode: ['Mode', "Pendant 25 à 40 jours, la demande pour un bien de luxe triple sur une île. Une rumeur l'annonce quelques jours avant : qui arrive le premier avec du stock vend très cher."],
  interdit: ['Bien interdit', "Le Conseil de l'île a interdit ce bien : il ne se négocie pas en bourse. On peut quand même en introduire par contrebande et le vendre au marché noir, très cher, mais chaque vente attire l'attention des autorités."],
  droits: ['Droits de douane', "Une taxe de 15 % de la valeur, payée à l'arrivée de vos marchandises sur l'île. Votée par le Conseil, elle dure un an. La contrebande permet d'y échapper, à vos risques."],
  embargo: ['Embargo', "Plus aucun navire ne peut aller directement d'une de ces deux îles à l'autre, le temps de l'embargo."],
  profondeur: ['Pourquoi le prix change quand j\'achète beaucoup', "Chaque vendeur ne propose qu'une certaine quantité. Quand vous en voulez plus, le reste vient des vendeurs suivants, plus chers. C'est pareil à la vente. Pour obtenir un bon prix sur un gros volume : achetez ou vendez par petits lots sur plusieurs jours, ou proposez votre propre prix et patientez."],
  limite: ['Mettre en vente ou proposer mon prix', "Au lieu d'accepter le prix des autres, vous déposez une offre qui attend preneur : « je vends 100 poissons salés à 24 § » ou « j'achète 100 rations à 20 § ». Les habitants achètent plusieurs fois par jour auprès des vendeurs les moins chers : une offre bien placée part vite. L'offre reste jusqu'à 30 jours ; votre marchandise (ou votre argent) est bloquée en attendant, et vous pouvez l'annuler à tout moment, en bas de la bourse de l'île."],
  carnet: ["Carnet d'ordres", "La liste de toutes les offres en attente sur l'île. Les vendeurs, avec leur prix et leur quantité, puis les acheteurs. Les meilleurs prix sont en haut. Les lignes en gras sont vos propres offres."],
  ailleurs: ["Ailleurs dans l'archipel", "Le prix connu de ce bien sur les autres îles, comparé à ici. La colonne Trajet donne la durée du voyage. Attention : sans comptoir, ces prix sont anciens. Et un prix moyen élevé ne garantit pas que les acheteurs paieront autant : regardez « Vous vendez à » une fois sur place."],
  perissable: ['Bien périssable', "Ce bien se gâte : une petite part du stock disparaît chaque jour (5 % pour le poisson frais, 3 % pour les champignons, 1 % pour les rations). Ne le gardez pas trop longtemps et préférez les trajets courts."],
  fret: ['Fret', "Vous louez de la place sur un navire marchand. Pas besoin de navire à vous, pas de limite de quantité. Le coût dépend de la distance, environ 0,3 § plus 0,1 § par jour de mer, par unité. Le fret ne permet pas la contrebande."],
  navire: ['Vos navires', "Un navire coûte 2 200 § à Boisnoir (2 800 § ailleurs), puis 6 § par jour d'entretien. Il emporte 150 unités sans frais de fret, et permet l'escorte et la contrebande. Il faut qu'il soit à quai dans le port de départ."],
  escorte: ['Escorte', "Des navires armés accompagnent votre convoi, pour 12 § par jour de mer. Le risque de pillage est divisé par cinq. Utile sur les routes de Brumaille, infestées de pirates."],
  contrebande: ['Contrebande', "Votre navire débarque discrètement : pas de droits de douane, et vous pouvez introduire des biens interdits. Mais la douane peut fouiller, d'autant plus que les autorités vous soupçonnent. En cas de fouille : marchandises saisies, amende, et suspicion en hausse."],
  risques: ['Risques en mer', "Les tempêtes, surtout en automne, coûtent une partie de la cargaison et retardent le convoi. Les pirates rôdent autour de Brumaille et peuvent tout prendre. La brume allonge les trajets de façon imprévisible. Il n'existe pas d'assurance : divisez vos cargaisons ou payez une escorte."],
  fortune: ['Courbe de fortune', "L'évolution de votre valeur nette jour après jour."],
  informateur: ['Informateur', "Un homme à vous sur une île sans comptoir : ses nouvelles vous arrivent avec 1 jour de retard seulement. Il vous permet aussi d'y lancer des rumeurs. 300 § puis 3 § par jour."],
  colombier: ['Colombier', "Vos oiseaux-messagers divisent par deux le retard des nouvelles venues des îles où vous n'avez pas de comptoir. 1 200 §, une fois pour toutes."],
  atelier: ['Ateliers', "Un atelier transforme des biens en un produit qui vaut plus : par exemple 3 céréales en 2 farines. Les ingrédients doivent être dans votre entrepôt de l'île ; le produit y est déposé chaque jour. Vous payez les ouvriers au salaire local. Le niveau 2 ou 3 multiplie la production. Un atelier s'arrête pendant une grève ou s'il manque d'ingrédients ou d'argent."],
  marge: ['Marge par lot', "Ce que rapporte un lot aux prix actuels de l'île : valeur du produit, moins les ingrédients et les salaires. C'est une estimation : si vous achetez les ingrédients ailleurs, moins cher, la marge est meilleure."],
  options: ['Les options', "Un pari sur le prix futur d'un bien, à Port-Sablier. Vous payez une prime aujourd'hui. À l'échéance, l'option rapporte l'écart entre le cours et le prix d'exercice, multiplié par 10 unités, si le pari est gagnant. Sinon elle ne vaut rien et vous perdez la prime, jamais plus. Vous pouvez aussi la revendre avant l'échéance."],
  call: ["Option d'achat", "Vous pariez sur une hausse. Exemple : une option d'achat de céréales à 10 § rapporte (cours − 10) × 10 unités à l'échéance si le cours dépasse 10 §. Si le cours finit à 15 §, elle rapporte 50 §."],
  put: ['Option de vente', "Vous pariez sur une baisse. Exemple : une option de vente de céréales à 10 § rapporte (10 − cours) × 10 unités si le cours tombe sous 10 §. C'est aussi une assurance pour qui détient du stock."],
  prime: ['Prime', "Le prix d'une option, par contrat de 10 unités. Elle est plus chère quand l'échéance est lointaine et quand le marché est agité (humeur extrême), car le prix a plus de chances de bouger."],
  echeance: ['Échéance', "Le jour où l'option est réglée en Sceaux, au cours de Port-Sablier. Les échéances tombent à la fin de chaque saison."],
  fiabilite: ['Fiabilité', "Ce que les marchands pensent de votre parole. Elle monte quand vous honorez un contrat, baisse fortement quand vous en manquez un. Plus elle est haute, plus vous recevez de contrats, et mieux payés."],
  probite: ['Probité', "Votre honnêteté apparente. Elle baisse avec la contrebande, le marché noir, les fausses rumeurs et la corruption. Une faible probité rend vos rumeurs moins crédibles."],
  suspicion: ['Suspicion des autorités', "Chaque île vous surveille séparément. La suspicion monte avec vos activités illégales et redescend lentement. Au-dessus de 60, un inspecteur enquête ; au-dessus de 85, sanction : amende, saisie d'une partie de votre stock et exclusion de la bourse pendant 10 jours. Une faveur peut faire taire les curieux."],
  contrats: ['Contrats', "Un marchand vous demande de livrer une quantité de marchandise sur son île avant une date, à un prix plus élevé que le marché. Acceptez si vous pouvez réunir le stock à temps. Réussite : paiement, une faveur et de la fiabilité. Échec : sa rancune et une fiabilité en baisse."],
  faveurs: ['Faveurs', "Une dette morale qu'un personnage a envers vous, gagnée en honorant ses contrats. Dépensez-la pour obtenir un secret (vérité des rumeurs de son île, ce qui s'y prépare, état du vote au Conseil), pour étouffer une enquête, ou, si vous êtes Notable, pour orienter son vote."],
  relation: ['Relation', "Ce que ce personnage pense de vous, de −100 à +100. Elle monte quand vous tenez parole, baisse quand vous lui faites défaut. Les personnages rancuniers se souviennent longtemps."],
  traits: ['Traits de caractère', "Chaque personnage a cinq traits notés de 0 à 10 : Audace (taille de ses paris), Avidité (marges exigées, goût des coups tordus), Crédulité (poids qu'il donne aux rumeurs), Loyauté (respect de sa parole) et Rancune (mémoire des torts)."],
  lancer: ['Lancer une rumeur', "Vous payez des gens pour répandre une fausse nouvelle sur une île : « le sel va manquer ». Les marchands crédules y réagissent, et le prix bouge dans le sens voulu le temps qu'elle soit démentie. C'est de la manipulation : la suspicion monte, et si l'on remonte jusqu'à vous, votre probité en souffre."],
  rumeurs: ['Rumeurs', "Des nouvelles qui voyagent de port en port avec les navires. Certaines annoncent un vrai événement avant tout le monde (mauvaise récolte, grève, mode), d'autres sont inventées pour manipuler les prix. Dans tous les cas, les marchands qui y croient font bouger les prix."],

  conseil: ['Les Conseils', "Chaque île est gouvernée par un Conseil qui vote une mesure par saison, le 31e jour : taxe de bourse, droits de douane, interdiction, embargo, subvention des salaires. Ces lois changent les prix : anticipez-les."],
  factions: ['Factions', "Les groupes qui siègent au Conseil, avec leur poids en voix. En vert, ceux qui soutiennent la mesure ; en rouge, ceux qui s'y opposent. Une mesure passe si elle dépasse 50 %."],
  estimation: ['Estimation du vote', "Avec un comptoir ou un informateur sur l'île, vous avez une estimation large du vote. Le chiffre exact demande un secret d'initié, obtenu contre une faveur d'un personnage de l'île."],
  influencer: ['Peser sur un vote', "En tant que Notable : un don aux factions déplace le vote (et augmente votre prestige), la corruption le déplace plus fort mais attire la suspicion. Une faveur d'un notable de l'île donne aussi des voix."],
  saisons: ['Saisons', "Une saison dure 90 jours. Les céréales abondent en été et manquent en hiver ; la pêche faiblit en automne, saison des tempêtes. Chaque début de saison apporte de nouveaux votes et de nouvelles options."],

  afaire: ['À faire', "Tout ce qui demande votre attention : dangers (caisses vides, suspicion, pirates, marchandises qui se gâtent), contrats à saisir ou à livrer, marchandises qui attendent d'être vendues, et les meilleures occasions du moment. Le chiffre sur l'onglet compte les points qui demandent une action (hors opportunités)."],
  comparer: ['Comparer les îles', "Les meilleures affaires connues : pour chaque bien, l'île où l'acheter et celle où le revendre, avec le gain estimé par unité, taxes et fret compris. Le tableau complet montre le prix de chaque bien sur chaque île : en vert le moins cher, en rouge le plus cher. Les prix des îles sans comptoir sont ceux de vos dernières nouvelles, d'où l'âge indiqué."],
  revente: ['Meilleure revente', "L'île où ce bien vaut le plus, selon vos informations, et l'écart avec le prix d'ici. Si l'écart est grand, il y a peut-être une affaire à faire, à condition que le fret et le trajet ne mangent pas le gain. L'âge de l'information est indiqué quand elle n'est pas en direct."],
  marchenoir: ['Marché noir', "Là où un bien est interdit, des acheteurs discrets le paient plus du double de son prix ailleurs. Jusqu'à 20 unités par jour et par île ; chaque vente fait monter la suspicion."],
};

<script>// L'Archipel des Brumes — interface
(function () {
'use strict';
const E = window.ARCHIPEL, D = E.D;
const { GOODS, G, RECIPES, STRATA, STRATA_NAMES, ISLANDS, I, FACTIONS, OPTION_GOODS, OPTION_SIZE, STAGES, ROLE_NAMES, STYLE_NAMES, TRAITS } = D;
const SAVE_KEY = 'archipel-des-brumes-v1';
const HOURS_PER_SEC = 24 / 20; // une journée = 20 s à vitesse 1

const ui = {
  sel: 'port', tab: 'bourse', good: null, speed: 0, lastSpeed: 1, acc: 0, modalQueue: [], dirty: true, lastRender: 0,
  form: { qty: 10, price: '', from: null, to: null, mode: 'fret', shipId: null, escort: false, smuggle: false, cargo: {},
    optGood: 'cereales', optExp: 0, optN: 1, rIsl: 'port', rGood: 'rations', rDir: 1, don: 200, fadIsl: 'port', fadGood: 'lanterne', wRecipe: 'farine' },
};
const S = () => E.S;
const P = () => E.S.player;
const PA = () => E.S.accounts.player;

// ---------------------------------------------------------------- formats
const fmt = x => (x == null || isNaN(x)) ? '—' : Math.round(x).toLocaleString('fr-FR');
const fp = x => x == null || isNaN(x) ? '—' : (x < 10 ? x.toFixed(2) : x < 100 ? x.toFixed(1) : Math.round(x).toLocaleString('fr-FR')).replace('.', ',');
const pct = x => (x >= 0 ? '+' : '') + (x * 100).toFixed(1).replace('.', ',') + ' %';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = id => document.getElementById(id);

function dateStr() {
  const gd = E.gday(), si = E.seasonIdx();
  return `An ${E.year()} · ${D.SEASONS[si]} · jour ${(((gd % 90) + 90) % 90) + 1}`;
}

// ---------------------------------------------------------------- notifications
function toast(msg, err) {
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => t.remove(), err ? 5000 : 3800);
}
function act(res) {
  if (!res) return;
  toast(res.msg, !res.ok);
  ui.dirty = true;
  render(true);
}
function pumpAlerts() {
  const al = S().alerts;
  if (!al.length) return;
  S().alerts = [];
  al.forEach(a => {
    if (a.pause) ui.modalQueue.push(a);
    else toast(a.title ? `${a.title} — ${a.text}` : a.text);
  });
  if (ui.modalQueue.length && !$('modal').classList.contains('on')) {
    if (ui.speed > 0) { ui.lastSpeed = ui.speed; setSpeed(0); }
    showAlert();
  }
}
function showAlert() {
  const a = ui.modalQueue.shift();
  if (!a) { closeModal(); return; }
  const more = ui.modalQueue.length;
  openModal(`<div class="kicker">Jour ${E.gday()} · ${esc(a.cat || 'nouvelle')}</div><h1>${esc(a.title)}</h1><p>${esc(a.text)}</p>
    <div class="actions">${more ? `<button class="btn" data-act="alert-all">Tout passer (${more})</button><button class="btn" data-act="alert-next">Suivante</button>` : ''}
    <button class="btn primary" data-act="alert-resume">Reprendre</button></div>`);
}
function openModal(html, wide) { $('modal').innerHTML = `<div class="box${wide ? ' wide' : ''}">${html}</div>`; $('modal').classList.add('on'); }
function closeModal() { $('modal').classList.remove('on'); $('modal').innerHTML = ''; }

// ---------------------------------------------------------------- sauvegarde
function save(silent) {
  try { localStorage.setItem(SAVE_KEY, E.save()); if (!silent) toast('Partie sauvegardée dans ce navigateur.'); }
  catch (e) { if (!silent) toast("Sauvegarde impossible dans ce navigateur.", true); }
}
function loadSave() {
  try { const s = localStorage.getItem(SAVE_KEY); if (!s) return false; E.load(JSON.parse(s)); return true; }
  catch (e) { return false; }
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }

// ---------------------------------------------------------------- vitesse & boucle
function setSpeed(v) {
  ui.speed = v;
  document.querySelectorAll('.speed button').forEach(b => b.classList.toggle('on', +b.dataset.v === v));
}
let lastT = performance.now(), lastDay = -1;
function frame(t) {
  const dt = Math.min(0.25, (t - lastT) / 1000);
  lastT = t;
  if (S() && ui.speed > 0 && !$('modal').classList.contains('on')) {
    ui.acc += dt * ui.speed * HOURS_PER_SEC;
    let n = 0;
    while (ui.acc >= 1 && n < 60) { E.tick(); ui.acc -= 1; n++; }
    if (n) {
      ui.dirty = true;
      pumpAlerts();
      if (E.day() !== lastDay) { lastDay = E.day(); if (E.gday() % 5 === 0) save(true); }
    }
  }
  if (S()) {
    drawShips();
    drawFx();
    if (ui.dirty && t - ui.lastRender > 450) render();
  }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- carte
const NS = 'http://www.w3.org/2000/svg';
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function blob(cx, cy, r, seed) {
  const n = 16, pts = [];
  let h = seed;
  const rnd = () => { h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0; return (h % 10000) / 10000; };
  const k1 = rnd() * 6.28, k2 = rnd() * 6.28;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2;
    const rr = r * (1 + 0.16 * Math.sin(a * 2 + k1) + 0.1 * Math.sin(a * 3 + k2) + (rnd() - 0.5) * 0.22);
    pts.push([cx + Math.cos(a) * rr * 1.25, cy + Math.sin(a) * rr * 0.85]);
  }
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;

function morphChildren(a, b) {

    if (na.nodeType !== nb.nodeType || na.nodeName !== nb.nodeName) { a.replaceChild(nb.cloneNode(true), na); continue; }
    if (na.nodeType !== 1) { if (na.nodeValue !== nb.nodeValue) na.nodeValue = nb.nodeValue; continue; }
    syncAttrs(na, nb);
    morphChildren(na, nb);
    if (na.tagName === 'SELECT' && document.activeElement !== na) { const o = nb.querySelector('option[selected]'); if (o && na.value !== o.value) na.value = o.value; }

  }
}

function bar(v, cls) { return `<div class="bar ${cls || (v < 0.4 ? 'bad' : v < 0.65 ? 'warn' : '')}"><i style="width:${Math.max(2, Math.min(100, v * 100))}%"></i></div>`; }
function lockBox(stage) {

function chart(values, opt) {
  opt = opt || {};
  const W = 520, H = opt.h || 130, pad = 4;
  if (!values || values.length < 2) return '<p class="note">Pas encore d\'historique.</p>';
  const v = values.slice(-(opt.n || 90));
  let lo = Math.min(...v), hi = Math.max(...v);
  if (opt.base) { lo = Math.min(lo, opt.base); hi = Math.max(hi, opt.base); }
  if (hi - lo < 1e-6) { hi += 1; lo -= 1; }
  const X = k => pad + k / (v.length - 1) * (W - pad * 2 - 46), Y = y => pad + (1 - (y - lo) / (hi - lo)) * (H - pad * 2 - 14);
  const pts = v.map((y, k) => `${X(k).toFixed(1)},${Y(y).toFixed(1)}`).join(' ');
  const last = v[v.length - 1];
  const baseLine = opt.base ? `<line x1="${pad}" x2="${W - 50}" y1="${Y(opt.base)}" y2="${Y(opt.base)}" stroke="#8a7253" stroke-dasharray="3 4" stroke-width="1"/><text x="${W - 46}" y="${Y(opt.base) + 4}" font-size="11" fill="#8a7253">base ${fp(opt.base)}</text>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
    <polygon points="${X(0)},${H - 14} ${pts} ${X(v.length - 1)},${H - 14}" fill="rgba(176,132,58,.16)"/>
    ${baseLine}
    <polyline points="${pts}" fill="none" stroke="${opt.color || '#7b5823'}" stroke-width="1.8"/>
    <circle cx="${X(v.length - 1)}" cy="${Y(last)}" r="3" fill="${opt.color || '#7b5823'}"/>
    <text x="${X(v.length - 1) + 6}" y="${Y(last) + 4}" font-size="12.5" font-weight="700" fill="#2f2216">${fp(last)}</text>
    <text x="${pad}" y="${H - 2}" font-size="11" fill="#8a7253">il y a ${v.length - 1} j</text>
    <text x="${W - 50}" y="${H - 2}" font-size="11" fill="#8a7253" text-anchor="end">${opt.label || "aujourd'hui"}</text>
    <text x="${pad}" y="12" font-size="11" fill="#8a7253">max ${fp(hi)}</text>
  </svg>`;
}
function islOptions(sel, filter) {
  return ISLANDS.filter(i => !filter || filter(i.id)).map(i => `<option value="${i.id}" ${sel === i.id ? 'selected' : ''}>${esc(i.name)}</option>`).join('');
}
function goodOptions(sel, list) { return (list || GOODS.map(g => g.id)).map(g => `<option value="${g}" ${sel === g ? 'selected' : ''}>${esc(G[g].name)}</option>`).join(''); }
function walkBook(isl, g, side, qty) {
  const arr = side === 'buy' ? S().books[isl][g].asks : S().books[isl][g].bids;
  let left = qty, cost = 0;
  for (const o of arr) { if (o.a === 'player') continue; const q = Math.min(left, o.qty); cost += q * o.price; left -= q; if (left <= 0) break; }
  const filled = qty - left;
  return { filled, avg: filled ? cost / filled : null, cost };
}

// ---------------------------------------------------------------- données connues (avec le brouillard)
const SHORT = { port: 'Port-S.', ferre: 'Ferrecr.', verd: 'Verdanes', cora: 'Corallie', bois: 'Boisnoir', eclat: 'H.-Éclat', brum: 'Brumaille' };
function known(isl, g) {
  const k = E.knownSnap(isl);
  if (k.live) { const b = S().books[isl][g]; return { p: b.ema, bid: E.bestBid(isl, g), ask: E.bestAsk(isl, g), delay: 0, live: true }; }
  if (!k.snap) return null;
  const v = k.snap.p[g];
  return { p: v[0], bid: v[1], ask: v[2], delay: k.delay, live: false };
}
// meilleure île connue pour revendre un bien (hors île de départ)
function bestResale(isl, g) {
  let best = null;
  ISLANDS.forEach(i => {
    if (i.id === isl || S().isl[i.id].banned[g]) return;
    const k = known(i.id, g); if (!k) return;
    if (!best || k.p > best.p) best = { isl: i.id, p: k.p, delay: k.delay };
  });
  return best;
}
// meilleures affaires connues : acheter en A, revendre en B (en mettant en vente au cours), fret compris
function deals(n) {
  const best = {};
  GOODS.forEach(g => ISLANDS.forEach(A => {
    if (S().isl[A.id].banned[g.id]) return;
    const ka = known(A.id, g.id); if (!ka) return;
    const buy = ka.ask != null ? ka.ask : ka.p * 1.1;
    const cost = buy * (1 + S().isl[A.id].tax);
    ISLANDS.forEach(B => {
      if (B.id === A.id || S().isl[B.id].banned[g.id] || E.embargoed(A.id, B.id)) return;
      const kb = known(B.id, g.id); if (!kb) return;
      const days = E.PATH[A.id][B.id].days;
      if (G[g.id].perish > 0.02 && days > 4) return;
      const sell = kb.p * 0.97 * (1 - S().isl[B.id].tax) - (S().isl[B.id].tariffs[g.id] || 0) * kb.p;
      const gain = sell - cost - E.freightCost(days) - kb.p * G[g.id].perish * days;
      const pc = gain / cost;
      if (gain <= 0.3 || pc < 0.12) return;
      const score = pc * Math.sqrt(gain) / (1 + days / 6);
      if (!best[g.id] || score > best[g.id].score) best[g.id] = { g: g.id, A: A.id, B: B.id, buy, sell, gain, pc, days, score, delay: Math.max(ka.delay, kb.delay) };
    });
  }));
  return Object.values(best).sort((a, b) => b.score - a.score).slice(0, n);
}

  if (!ds.length) h += `<p class="note">Aucun écart rentable avec vos informations actuelles.</p>`;
  else {
    h += `<table class="t deals"><thead><tr><th>Bien</th><th>Acheter à</th><th>Revendre à</th><th class="n">Gain / unité</th><th class="n hide-m">Trajet</th></tr></thead><tbody>` + ds.map(d => `<tr class="row" data-act="goto-good" data-isl="${d.A}" data-g="${d.g}">
      <td><b>${esc(G[d.g].name)}</b></td>
      <td>${esc(SHORT[d.A])}${E.present(d.A) ? '' : '<span class="nocpt" title="pas de comptoir">°</span>'} <span class="muted">${fp(d.buy)} §</span></td>
      <td>${esc(SHORT[d.B])}${E.present(d.B) ? '' : '<span class="nocpt" title="pas de comptoir">°</span>'} <span class="muted">≈ ${fp(d.sell)} §</span></td>
      <td class="n nowrap"><b class="up">+${fp(d.gain)} §</b><br><span class="muted small">${Math.round(d.pc * 100)} %${d.delay ? ` · info de ${d.delay} j` : ''}</span></td><td class="n hide-m">${d.days} j</td></tr>`).join('') + `</tbody></table>
      <p class="note">Gain estimé par unité, taxes et fret compris, si vous revendez en mettant en vente au cours de l'île d'arrivée. ° : vous n'avez pas de comptoir sur cette île (il en faut un pour y commercer). Touchez une ligne pour ouvrir le bien sur l'île d'achat.</p>`;
  }
  h += `<h4>Tous les prix</h4><div class="scrollx"><table class="t grid"><thead><tr><th>Bien</th>` + ISLANDS.map(i => { const d = E.infoDelay(i.id); return `<th class="n">${esc(SHORT[i.id])}<br><span class="age ${d ? '' : 'live'}">${d ? d + ' j' : 'direct'}</span></th>`; }).join('') + `</tr></thead><tbody>`;
  let tier = -1;
  GOODS.forEach(g => {
    if (g.tier !== tier) { tier = g.tier; h += `<tr class="tier"><td colspan="8">${['Matières brutes', 'Produits transformés', 'Composants', 'Produits finis'][tier]}</td></tr>`; }
    const vals = ISLANDS.map(i => { const k = known(i.id, g.id); return S().isl[i.id].banned[g.id] ? null : k ? k.p : null; });
    const ok = vals.filter(v => v != null);
    const lo = Math.min(...ok), hi = Math.max(...ok);
    h += `<tr><td>${esc(g.name)}</td>` + ISLANDS.map((i, k) => {
      const v = vals[k], mine = E.stockOf(PA(), i.id, g.id);
      if (S().isl[i.id].banned[g.id]) return `<td class="n muted">interdit</td>`;
      const cls = ok.length > 1 && v === lo ? 'lo' : ok.length > 1 && v === hi ? 'hi' : '';
      return `<td class="n cell ${cls} ${mine ? 'own' : ''}" data-act="goto-good" data-isl="${i.id}" data-g="${g.id}">${fp(v)}</td>`;
    }).join('') + `</tr>`;
  });
  h += `</tbody></table></div><p class="note"><span class="lo pill">vert</span> le moins cher · <span class="hi pill">rouge</span> le plus cher · <span class="own pill">doré</span> vous en avez sur cette île. Touchez un prix pour ouvrir la bourse de l'île.</p>`;
  return h;
}

// ---------------------------------------------------------------- COMPTOIRS : tout ce que vous possédez
function pEntrepots() {
  const pl = P(), a = PA();
  let stockVal = 0, seaVal = 0, ordVal = 0;
  ISLANDS.forEach(i => { for (const g in a.stock[i.id]) stockVal += a.stock[i.id][g] * S().books[i.id][g].ema; });
  const sea = S().shipments.filter(s => s.owner === 'player');
  sea.forEach(s => { for (const g in s.cargo) seaVal += s.cargo[g] * S().books[s.from][g].ema; });
  const orders = E.playerOrders();
  orders.forEach(o => { ordVal += o.side === 'buy' ? o.qty * o.price : o.qty * S().books[o.isl][o.g].ema; });
  const wages = pl.workshops.filter(w => w.on).reduce((t, w) => t + RECIPES[w.recipe].workers * w.level * S().isl[w.isl].wage, 0);
  const esc_ = sea.filter(s => s.escort).length;
  const fees = [
    [`${pl.comptoirs.length} comptoir(s) × ${E.COSTS.comptoirDay} §`, pl.comptoirs.length * E.COSTS.comptoirDay],
    [`${pl.ships.length} navire(s) × ${E.COSTS.shipDay} §`, pl.ships.length * E.COSTS.shipDay],
    [`${pl.informants.length} informateur(s) × ${E.COSTS.informantDay} §`, pl.informants.length * E.COSTS.informantDay],
    [`${esc_} escorte(s) en mer × ${E.COSTS.escortDay} §`, esc_ * E.COSTS.escortDay],
    [`Salaires des ateliers (à pleine production)`, wages],
  ];
  const feeTot = fees.reduce((t, f) => t + f[1], 0);
  let h = `<h2>Comptoirs et biens</h2><p class="sub">Tout ce que vous possédez, où que ce soit.</p>`;
  h += `<div class="kpis"><div><span>Sceaux ${q('sceaux')}</span><b>${fmt(a.cash)} §</b></div><div><span>En entrepôt</span><b>${fmt(stockVal)} §</b></div><div><span>En mer</span><b>${fmt(seaVal)} §</b></div><div><span>Offres en attente</span><b>${fmt(ordVal)} §</b></div><div><span>Frais / jour</span><b class="down">−${fmt(feeTot)} §</b></div></div>`;
  // stocks
  const view = ui.stockView || 'bien';
  h += `<h4>Stocks en entrepôt ${q('stock')}</h4><div class="seg small"><button class="${view === 'bien' ? 'on' : ''}" data-act="stockview" data-v="bien">Par bien</button><button class="${view === 'ile' ? 'on' : ''}" data-act="stockview" data-v="ile">Par île</button></div>`;
  const byGood = {};
  ISLANDS.forEach(i => { for (const g in a.stock[i.id]) (byGood[g] = byGood[g] || []).push([i.id, a.stock[i.id][g]]); });
  if (!Object.keys(byGood).length) h += `<p class="note">Aucun stock. Achetez en bourse pour remplir vos entrepôts.</p>`;
  else if (view === 'bien') {
    h += `<table class="t"><thead><tr><th>Bien</th><th class="n">Total</th><th>Où</th><th class="n hide-m">Valeur</th><th>Meilleure revente</th></tr></thead><tbody>`;
    GOODS.filter(g => byGood[g.id]).forEach(g => {
      const list = byGood[g.id], tot = list.reduce((t, x) => t + x[1], 0);
      const val = list.reduce((t, x) => t + x[1] * S().books[x[0]][g.id].ema, 0);
      const main = list.slice().sort((x, y) => y[1] - x[1])[0][0];
      const rs = bestResale(null, g.id);
      h += `<tr><td><b>${esc(g.name)}</b>${G[g.id].perish >= 0.01 ? ' <span class="tag">périssable</span>' : ''}</td><td class="n"><b>${fmt(tot)}</b></td>
        <td>${list.map(([i, qq]) => `<button class="chipbtn" data-act="goto-good" data-isl="${i}" data-g="${g.id}">${esc(SHORT[i])} ${fmt(qq)}</button>`).join(' ')}</td>
        <td class="n hide-m">${fmt(val)} §</td><td>${rs ? `${esc(SHORT[rs.isl])} <b>${fp(rs.p)} §</b>${rs.delay ? ` <span class="age">${rs.delay} j</span>` : ''}` : '—'} <button class="btn small" data-act="ship-from" data-isl="${main}">Expédier</button></td></tr>`;
    });
    h += `</tbody></table>`;
  } else {
    ISLANDS.forEach(i => {
      const st = a.stock[i.id], goods = Object.keys(st);
      if (!goods.length) return;
      let val = 0; goods.forEach(g => { val += st[g] * S().books[i.id][g].ema; });
      h += `<div class="card ${E.present(i.id) ? 'hl' : ''}"><div class="row-flex" style="justify-content:space-between"><b>${esc(i.name)}</b><span class="muted">≈ ${fmt(val)} §</span></div>
        <div class="chips">${goods.map(g => `<button class="chipbtn" data-act="goto-good" data-isl="${i.id}" data-g="${g}">${esc(G[g].name)} <b>${fmt(st[g])}</b></button>`).join('')}</div>
        <div class="row-flex"><button class="btn small" data-act="goto" data-isl="${i.id}">Bourse</button><button class="btn small" data-act="ship-from" data-isl="${i.id}">Expédier</button></div></div>`;
    });
  }
  // en mer
  h += `<h4>Marchandises en mer (${sea.length})</h4>`;
  if (!sea.length) h += `<p class="note">Aucun convoi en route.</p>`;
  else h += `<table class="t"><tbody>` + sea.map(s => `<tr><td><b>${esc(SHORT[s.from])} → ${esc(SHORT[s.to])}</b><br><span class="note">${Object.keys(s.cargo).map(g => fmt(s.cargo[g]) + ' ' + gname(g)).join(', ') || 'à vide'}</span></td><td class="n">arrivée dans<br><b>${Math.max(0, (s.arr - S().hour) / 24).toFixed(1).replace('.', ',')} j</b></td></tr>`).join('') + `</tbody></table>`;
  // offres
  h += `<h4>Offres en attente (${orders.length}) ${q('limite')}</h4>`;
  if (!orders.length) h += `<p class="note">Aucune offre en attente.</p>`;
  else h += `<table class="t"><tbody>` + orders.map(o => `<tr><td>${o.side === 'buy' ? 'Achat' : 'Vente'} · <b>${esc(G[o.g].name)}</b><br><span class="note">${esc(I[o.isl].name)}</span></td><td class="n">${fmt(o.qty)} à ${fp(o.price)} §</td><td class="n"><button class="btn small" data-act="cancel" data-isl="${o.isl}" data-g="${o.g}" data-id="${o.id}">Annuler</button></td></tr>`).join('') + `</tbody></table>`;
  // frais
  h += `<h4>Frais quotidiens</h4><table class="t"><tbody>` + fees.filter(f => f[1] > 0).map(f => `<tr><td>${f[0]}</td><td class="n">${fmt(f[1])} §</td></tr>`).join('') + `<tr><td><b>Total</b></td><td class="n"><b>${fmt(feeTot)} §</b></td></tr></tbody></table>`;
  // réseau
  h += `<h4>Comptoirs et réseau d'information ${q('nouvelles')}</h4>`;
  h += `<table class="t"><thead><tr><th>Île</th><th>Présence</th><th class="n">Retard</th><th></th></tr></thead><tbody>` + ISLANDS.map(i => {
    const pres = E.present(i.id), inf = pl.informants.includes(i.id);
    return `<tr><td>${esc(i.name)}</td><td>${pres ? '<b>Comptoir</b>' : inf ? 'Informateur' : '—'}</td><td class="n">${E.infoDelay(i.id)} j</td><td class="n">
      ${!pres ? `<button class="btn small" data-act="open-cpt" data-isl="${i.id}">Comptoir ${E.COSTS.comptoir} §</button>` : i.id !== 'port' ? `<button class="btn small" data-act="close-cpt" data-isl="${i.id}">Fermer</button>` : ''}
      ${!pres && !inf && pl.unlocked[2] ? `<button class="btn small" data-act="hire-inf" data-isl="${i.id}">Informateur ${E.COSTS.informant} §</button>` : ''}
      ${inf ? `<button class="btn small" data-act="fire-inf" data-isl="${i.id}">Congédier</button>` : ''}</td></tr>`;
  }).join('') + `</tbody></table>`;
  if (pl.unlocked[2] && !pl.colombier) h += `<div class="row-flex" style="margin-top:8px"><button class="btn" data-act="colombier">Bâtir un colombier (${fmt(E.COSTS.colombier)} §)</button>${q('colombier')}</div>`;
  if (pl.colombier) h += `<p class="note">Votre colombier est en service.</p>`;
  if (!pl.unlocked[2]) h += `<p class="note">Informateurs et colombier s'ouvrent au stade Négociant. Un colporteur ne peut tenir que 2 comptoirs.</p>`;
  h += `<h4>Votre fortune ${q('fortune')}</h4>` + chart(S().netHist, { color: '#4d6a37', n: 360 });
  return h;
}

// ---------------------------------------------------------------- NAVIGATION
function pNavigation() {
  const pl = P(), a = PA(), f = ui.form;
  const origins = ISLANDS.filter(i => Object.keys(a.stock[i.id]).length || pl.ships.some(s => s.at === i.id && s.status === 'idle')).map(i => i.id);
  if (!f.from || !origins.includes(f.from)) f.from = origins[0] || null;
  const dests = pl.comptoirs.filter(x => x !== f.from);
  if (!f.to || !dests.includes(f.to)) f.to = dests[0] || null;
  let h = `<h2>Navigation</h2><p class="sub">Expédiez vos marchandises vers une île où vous avez un comptoir.</p>`;
  if (!f.from) h += `<div class="card"><p class="note">Vous n'avez de stock nulle part. Achetez d'abord en bourse.</p></div>`;
  else if (!f.to) h += `<div class="card"><p class="note">Il vous faut un comptoir sur une autre île pour y recevoir des marchandises.</p><button class="btn small" data-act="tab" data-tab="entrepots">Ouvrir un comptoir</button></div>`;
  else {
    const st = a.stock[f.from];
    let total = 0; const loaded = [];
    Object.keys(st).forEach(g => { const qq = Math.min(+f.cargo[g] || 0, st[g]); if (qq > 0) { total += qq; loaded.push([g, qq]); } });
    // 1. chargement
    h += `<div class="step"><div class="sh"><span class="stepn">1</span><b>Départ et chargement</b></div>
      <label class="field">Port de départ<select data-bind="from">${islOptions(f.from, x => origins.includes(x))}</select></label>
      <table class="t" style="margin-top:6px"><thead><tr><th>Bien</th><th class="n">En stock</th><th class="n">À charger</th></tr></thead><tbody>`;
    Object.keys(st).forEach(g => {
      h += `<tr class="${+f.cargo[g] > 0 ? 'own' : ''}"><td>${esc(G[g].name)}${G[g].perish >= 0.01 ? ' <span class="tag">périssable</span>' : ''}</td><td class="n">${fmt(st[g])}</td>
        <td class="n"><input class="num" type="number" min="0" max="${st[g]}" data-bind="cargo.${g}" value="${f.cargo[g] || ''}"> <button class="btn small" data-act="cargo-all" data-g="${g}" data-v="${st[g]}">tout</button></td></tr>`;
    });
    h += `</tbody></table></div>`;
    // 2. destination
    h += `<div class="step"><div class="sh"><span class="stepn">2</span><b>Destination</b> ${q('risques')}</div><table class="t dest"><thead><tr><th></th><th>Île</th><th class="n">Trajet</th><th>Risques</th><th class="n">${loaded.length ? 'Revente estimée' : 'Prix connus'}</th></tr></thead><tbody>`;
    dests.forEach(d => {
      const pth = E.PATH[f.from][d], dst = S().isl[d];
      const emb = E.embargoed(f.from, d);
      let rev = 0, cost = 0, warn = [];
      loaded.forEach(([g, qq]) => {
        const k = known(d, g); if (dst.banned[g]) warn.push(`${gname(g)} interdit`); else if (dst.tariffs[g]) warn.push(`droits sur ${gname(g)}`);
        if (k) rev += qq * k.p * 0.97 * (1 - dst.tax); cost += qq * S().books[f.from][g].ema;
      });
      const risk = [pth.danger > 0.4 ? '<span class="down">pirates</span>' : pth.danger > 0.15 ? 'pirates modérés' : 'calme', E.seasonIdx() === 2 ? '<span class="down">tempêtes</span>' : ''].filter(Boolean).join(', ');
      h += `<tr class="row ${f.to === d ? 'sel' : ''}" data-act="set-dest" data-v="${d}"><td><input type="radio" ${f.to === d ? 'checked' : ''} ${emb ? 'disabled' : ''}></td><td><b>${esc(I[d].name)}</b>${emb ? ' <span class="tag">embargo</span>' : ''}${warn.length ? `<br><span class="note down">${esc(warn.join(', '))}</span>` : ''}</td>
        <td class="n">${pth.days} j</td><td>${risk}</td><td class="n">${loaded.length ? `<b>${fmt(rev)} §</b> <span class="${rev > cost ? 'up' : 'down'}">${cost ? (rev >= cost ? '+' : '−') + Math.round(Math.abs(rev / cost - 1) * 100) + ' %' : ''}</span>` : '<span class="muted">chargez d\'abord</span>'}${E.infoDelay(d) ? ` <span class="age">${E.infoDelay(d)} j</span>` : ''}</td></tr>`;
    });
    h += `</tbody></table><p class="note">Revente estimée : ce que rapporterait votre chargement mis en vente au cours connu de l'île, comparé à sa valeur ici.</p></div>`;
    // 3. transport
    const pth = E.PATH[f.from][f.to];
    const idle = pl.ships.filter(s => s.at === f.from && s.status === 'idle');
    if (f.mode === 'navire' && !idle.length) f.mode = 'fret';
    if (f.mode === 'navire' && !idle.some(s => s.id === +f.shipId)) f.shipId = idle[0].id;
    const cost = f.mode === 'fret' ? Math.ceil(total * E.freightCost(pth.days)) : 0;
    h += `<div class="step"><div class="sh"><span class="stepn">3</span><b>Transport</b></div>
      <div class="row-flex" style="margin:2px 0 6px"><label><input type="radio" name="mode" data-bind="mode" value="fret" ${f.mode === 'fret' ? 'checked' : ''}> Fret, ${fp(E.freightCost(pth.days))} § par unité</label>${q('fret')}
      <label><input type="radio" name="mode" data-bind="mode" value="navire" ${f.mode === 'navire' ? 'checked' : ''} ${idle.length ? '' : 'disabled'}> Mon navire ${idle.length ? '' : '(aucun à quai ici)'}</label>${q('navire')}</div>`;
    if (f.mode === 'navire') h += `<div class="row-flex"><select data-bind="shipId">${idle.map(s => `<option value="${s.id}" ${+f.shipId === s.id ? 'selected' : ''}>${esc(s.name)} (${s.cap} places)</option>`).join('')}</select>
        <label><input type="checkbox" data-bind="escort" ${f.escort ? 'checked' : ''}> Escorte (${E.COSTS.escortDay} §/j)</label>${q('escorte')}
        <label><input type="checkbox" data-bind="smuggle" ${f.smuggle ? 'checked' : ''}> Contrebande</label>${q('contrebande')}</div>`;
    h += `<div class="recap"><div><span>Chargement</span><b>${fmt(total)} unités</b></div><div><span>Vers</span><b>${esc(I[f.to].name)}</b></div><div><span>Durée</span><b>≈ ${pth.days} j</b></div><div><span>Coût</span><b>${f.mode === 'fret' ? fmt(cost) + ' §' : 'entretien' + (f.escort ? ' + escorte' : '')}</b></div></div>`;
    if (cost > a.cash) h += `<p class="warn-box">Il vous manque ${fmt(cost - a.cash)} § pour payer le fret. Avec vos ${fmt(a.cash)} §, vous pouvez expédier au plus ${fmt(Math.floor(a.cash / E.freightCost(pth.days)))} unités.</p>`;
    h += `<button class="btn primary wide" data-act="ship" ${(total || f.mode === 'navire') && cost <= a.cash && !E.embargoed(f.from, f.to) ? '' : 'disabled'}>Expédier ${fmt(total)} unités vers ${esc(I[f.to].name)}</button></div>`;
  }
  const mine = S().shipments.filter(s => s.owner === 'player');
  h += `<h4>En mer (${mine.length})</h4>`;
  if (!mine.length) h += `<p class="note">Aucun convoi en route.</p>`;
  mine.forEach(sh => {
    const p = Math.min(1, (S().hour - sh.dep) / (sh.arr - sh.dep));
    const ship = sh.shipId ? pl.ships.find(s => s.id === sh.shipId) : null;
    h += `<div class="card"><div class="row-flex" style="justify-content:space-between"><b>${esc(I[sh.from].name)} → ${esc(I[sh.to].name)}</b><span class="muted">arrivée dans <b>${Math.max(0, (sh.arr - S().hour) / 24).toFixed(1).replace('.', ',')} j</b></span></div>
      ${bar(p, ' ')}<div class="chips">${Object.keys(sh.cargo).map(g => `<span class="chip">${esc(G[g].name)} : ${fmt(sh.cargo[g])}</span>`).join('') || '<span class="chip">à vide</span>'}<span class="chip">${ship ? esc(ship.name) : 'fret'}${sh.escort ? ' · escorte' : ''}${sh.smuggle ? ' · contrebande' : ''}</span></div></div>`;
  });
  h += `<h4>Votre flotte ${q('navire')}</h4>`;
  if (!pl.unlocked[2]) h += `<p class="note">Posséder des navires demande le stade Négociant (5 000 § de valeur nette).</p>`;
  else {
    if (!pl.ships.length) h += `<p class="note">Aucun navire.</p>`;
    pl.ships.forEach(s => {
      h += `<div class="card row-flex" style="justify-content:space-between"><span><b>${esc(s.name)}</b> · ${s.cap} places · ${s.status === 'idle' ? 'à quai à ' + esc(I[s.at].name) : 'en mer'}</span>
        <span class="row-flex">${s.status === 'idle' ? `<select data-bind="moveTo.${s.id}">${islOptions(ui.form['moveTo.' + s.id] || 'port', x => x !== s.at)}</select><button class="btn small" data-act="move-ship" data-id="${s.id}">Envoyer à vide</button><button class="btn small" data-act="sell-ship" data-id="${s.id}">Vendre 1 500 §</button>` : ''}</span></div>`;
    });
    const isl = ui.sel;
    h += `<div class="row-flex"><button class="btn" data-act="buy-ship" data-isl="${isl}" ${E.present(isl) ? '' : 'disabled'}>Acheter un navire à ${esc(I[isl].name)} (${fmt(isl === 'bois' ? E.COSTS.ship : E.COSTS.shipFar)} §)</button><span class="note">Moins cher à Boisnoir. Entretien ${E.COSTS.shipDay} §/j.</span></div>`;
  }
  return h;
}

function maxBuyQty(isl, g) {
  const st = S().isl[isl]; let cash = PA().cash, n = 0;
  for (const o of S().books[isl][g].asks) { if (o.a === 'player') continue; const c = o.price * (1 + st.tax); const k = Math.min(o.qty, Math.floor(cash / c)); n += k; cash -= k * c; if (k < o.qty) break; }
  return n;
}
function gname(g, q) { return G[g].name.toLowerCase(); }
// résumé en clair d'un achat ou d'une vente
function tradeSummary(isl, g, side) {
  const st = S().isl[isl], tax = st.tax;
  if (side === 'buy') {
    const max = maxBuyQty(isl, g);
    if (!S().books[isl][g].asks.some(o => o.a !== 'player')) return { html: `<p class="sum">Personne ne vend de ${gname(g)} ici en ce moment. Revenez plus tard, ou proposez votre prix (option avancée ci-dessous).</p>`, label: 'Acheter', ok: false, q: 0 };
    if (max < 1) return { html: `<p class="sum">Vous n'avez pas assez de Sceaux pour en acheter une seule unité.</p>`, label: 'Acheter', ok: false, q: 0 };
    let q = Math.max(1, Math.min(max, Math.floor(+ui.form.bq || 1)));
    const w = walkBook(isl, g, 'buy', q), total = w.cost * (1 + tax);
    const first = S().books[isl][g].asks.find(o => o.a !== 'player');
    let warn = '';
    if (w.avg > first.price * 1.02) warn = `<p class="warn">Le premier vendeur n'en a que ${fmt(first.qty)} à ${fp(first.price)} § ; les suivants demandent plus cher. Acheter moins à la fois revient moins cher. ${q('profondeur')}</p>`;
    return { q, ok: true, label: `Acheter ${fmt(q)} pour ${fmt(total)} §`,
      html: `<p class="sum">Vous payez <b>${fmt(total)} §</b> pour <b>${fmt(q)}</b> ${gname(g)}, soit ${fp(total / q)} § l'unité taxe comprise. Il vous restera ${fmt(PA().cash - total)} §.</p>${warn}` };
  }
  const have = E.stockOf(PA(), isl, g);
  if (have < 1) return { html: `<p class="sum">Vous n'avez pas de ${gname(g)} dans votre entrepôt de ${esc(I[isl].name)}.</p>`, label: 'Vendre', ok: false, q: 0 };
  if (!S().books[isl][g].bids.some(o => o.a !== 'player')) return { html: `<p class="sum">Aucun acheteur n'attend en ce moment : mettez plutôt en vente ci-dessous.</p>`, label: 'Vendre tout de suite', ok: false, q: 0 };
  let q = Math.max(1, Math.min(have, Math.floor(+(ui.form.sq == null ? have : ui.form.sq) || 1)));
  const w = walkBook(isl, g, 'sell', q), got = w.cost * (1 - tax);
  const first = S().books[isl][g].bids.find(o => o.a !== 'player');
  let warn = '';
  if (w.filled < q) warn = `<p class="warn">Les acheteurs d'ici n'en prennent que ${fmt(w.filled)} aujourd'hui. Le reste ne sera pas vendu.</p>`;
  else if (w.avg < first.price * 0.98) warn = `<p class="warn">Le meilleur acheteur n'en prend que ${fmt(first.qty)} à ${fp(first.price)} § ; les suivants paient moins. Vendre par petits lots, sur plusieurs jours, rapporte plus. ${q('profondeur')}</p>`;
  return { q, ok: w.filled > 0, label: `Vendre tout de suite pour ${fmt(got)} §`,
    html: `<p class="sum">Vous touchez <b>${fmt(got)} §</b> pour <b>${fmt(Math.min(q, w.filled))}</b> ${gname(g)}, soit ${fp(w.filled ? got / w.filled : 0)} § l'unité après taxe. Vous en avez ${fmt(have)} ici.</p>${warn}` };
}
function listPrice(isl, g) {
  const ask = S().books[isl][g].asks.find(o => o.a !== 'player');
  return Math.round((ask ? Math.min(ask.price * 0.98, S().books[isl][g].ema * 1.15) : S().books[isl][g].ema) * 100) / 100;
}
function listSummary(isl, g) {
  const have = E.stockOf(PA(), isl, g);
  const q = Math.max(1, Math.min(have, Math.floor(+(ui.form.sq == null ? have : ui.form.sq) || 1)));
  const p = +String(ui.form.sp || listPrice(isl, g)).replace(',', '.') || listPrice(isl, g);
  const b = S().books[isl][g], ask = b.asks.find(o => o.a !== 'player');
  const vol = Math.max(1, Math.round(b.volEma));
  let pos = !ask || p <= ask.price ? `Ce sera l'offre la moins chère de l'île : les habitants et les marchands l'achèteront en priorité.` : `D'autres vendent moins cher (${fp(ask.price)} §) : ils passeront avant vous.`;
  return { q, p, label: `Mettre en vente ${fmt(q)} à ${fp(p)} §`,
    html: `<p class="note">${pos} Ici, il s'en échange environ ${fmt(vol)} par jour : comptez ${q <= vol ? 'quelques heures' : 'environ ' + Math.ceil(q / vol) + ' jours'} pour tout vendre. Rapport attendu : ${fmt(q * p * (1 - S().isl[isl].tax))} § après taxe. Vous pourrez annuler l'offre.</p>` };
}
// confirmation de chaque achat et vente
function confirmTrade(kind, g) {
  const isl = ui.sel, f = ui.form, st = S().isl[isl], cash = PA().cash;
  let title, rows, run;
  if (kind === 'buy') {
    const r = tradeSummary(isl, g, 'buy'); if (!r.ok) return toast('Achat impossible pour le moment.', true);
    const w = walkBook(isl, g, 'buy', r.q), tot = w.cost * (1 + st.tax);
    title = `Acheter ${fmt(r.q)} ${gname(g)} ?`;
    rows = [['Île', I[isl].name], ['Prix moyen', fp(w.avg) + ' § l\'unité'], ['Taxe de bourse', fmt(w.cost * st.tax) + ' §'], ['Total', '<b>' + fmt(tot) + ' §</b>'], ['Il vous restera', fmt(cash - tot) + ' §']];
    run = () => act(E.A.buyMarket(isl, g, r.q));
  } else if (kind === 'sell') {
    const r = tradeSummary(isl, g, 'sell'); if (!r.ok) return toast('Aucun acheteur pour le moment.', true);
    const w = walkBook(isl, g, 'sell', r.q), got = w.cost * (1 - st.tax);
    title = `Vendre ${fmt(Math.min(r.q, w.filled))} ${gname(g)} tout de suite ?`;
    rows = [['Île', I[isl].name], ['Prix moyen', fp(w.avg) + ' § l\'unité'], ['Taxe de bourse', fmt(w.cost * st.tax) + ' §'], ['Vous touchez', '<b>' + fmt(got) + ' §</b>']];
    run = () => { const res = E.A.sellMarket(isl, g, r.q); if (res.ok) tuto().sold = true; f.sq = null; act(res); };
  } else if (kind === 'list') {
    const l = listSummary(isl, g);
    title = `Mettre en vente ${fmt(l.q)} ${gname(g)} ?`;
    rows = [['Île', I[isl].name], ['Prix demandé', fp(l.p) + ' § l\'unité'], ['Rapport attendu', '<b>' + fmt(l.q * l.p * (1 - st.tax)) + ' §</b> après taxe'], ['Durée', 'jusqu\'à 30 jours, annulable']];
    run = () => { const res = E.A.limit(isl, g, 'sell', l.p, l.q); if (res.ok) { tuto().sold = true; f.sq = null; f.sp = ''; } act(res); };
  } else {
    const side = kind.slice(6), p = readInt(f.price) || S().books[isl][g].ema, qq = Math.floor(readInt(f.qty));
    if (!(qq > 0)) return toast('Indiquez une quantité.', true);
    title = side === 'buy' ? `Proposer d'acheter ${fmt(qq)} ${gname(g)} ?` : `Proposer de vendre ${fmt(qq)} ${gname(g)} ?`;
    rows = [['Île', I[isl].name], ['Votre prix', fp(p) + ' § l\'unité'], [side === 'buy' ? 'Argent bloqué' : 'Valeur', fmt(p * qq * (side === 'buy' ? 1 + st.tax : 1)) + ' §'], ['Durée', 'jusqu\'à 30 jours, annulable']];
    run = () => act(E.A.limit(isl, g, side, p, qq));
  }
  ui.pending = run;
  openModal(`<div class="kicker">Confirmation</div><h1>${title}</h1><div class="kv confirm">${rows.map(r => `<span>${r[0]}</span><b>${r[1]}</b>`).join('')}</div>
    <div class="actions"><button class="btn" data-act="close">Annuler</button><button class="btn primary" data-act="do-trade">Confirmer</button></div>`);
}
function updateTrade() {

function qtyCtl(key, max) {
  const cur = ui.form[key] == null ? (key === 'sq' ? max : 10) : ui.form[key];
  const v = Math.max(max ? 1 : 0, Math.min(max, Math.floor(+cur || 1)));
  ui.form[key] = v;
  if (!max) return '';
  const quick = [10, 50, 100].filter(n => n < max);
  return `<div class="qty"><button class="btn small" data-act="q-step" data-k="${key}" data-v="-1" data-max="${max}">−</button><input class="num" type="number" min="1" max="${max}" data-bind="${key}" value="${v}"><button class="btn small" data-act="q-step" data-k="${key}" data-v="1" data-max="${max}">+</button>
    <input type="range" min="1" max="${max}" value="${v}" data-bind="${key}"></div>
    <div class="row-flex quick">${quick.map(n => `<button class="btn small" data-act="q-set" data-k="${key}" data-v="${n}" data-max="${max}">${n}</button>`).join('')}<button class="btn small" data-act="q-set" data-k="${key}" data-v="${max}" data-max="${max}">${key === 'bq' ? 'Le maximum' : 'Tout'} (${fmt(max)})</button></div>`;
}
